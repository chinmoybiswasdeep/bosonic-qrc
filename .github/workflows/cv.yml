name: CV backend tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
      - run: bosonic-qrc-cv configs/smoke/memory.yaml --output results/cv-smoke
      - run: bosonic-qrc-cv-ipc configs/smoke/ipc.yaml --output results/ipc-smoke
