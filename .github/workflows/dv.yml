name: DV backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
      - run: bosonic-qrc-dv configs/smoke/xor.yaml --output results/calibration/xor
      - run: bosonic-qrc-dv-static-capacity configs/smoke/static_ipc.yaml --output results/calibration/static-ipc
      - run: bosonic-qrc-eoc-dv configs/eoc/smoke.yaml --output results/eoc/smoke
