[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosonic-qrc-dv"
version = "0.1.0"
description = "Backend-native discrete-variable photonic reservoir computing"
requires-python = ">=3.10,<3.14"
dependencies = ["perceval-quandela>=1.2,<1.3", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["dv_tests"]

[tool.setuptools.packages.find]
where = ["dv_src"]
