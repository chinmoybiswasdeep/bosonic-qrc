[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosonic-qrc-cv"
version = "0.1.0"
description = "Backend-native continuous-variable photonic reservoir computing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "piquasso==8.0.1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<1.8",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
bosonic-qrc-cv = "bosonic_qrc_cv.cli:main"
bosonic-qrc-cv-ipc = "bosonic_qrc_cv.ipc:main"
bosonic-qrc-cv-aggregate = "bosonic_qrc_cv.aggregate:main"
bosonic-qrc-cv-publication = "bosonic_qrc_cv.publication:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
