[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosonic-qrc-dv"
version = "0.2.0"
description = "Perceval-native discrete-variable photonic QRP"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "perceval-quandela>=1.2,<1.3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
bosonic-qrc-dv = "bosonic_qrc_dv.cli:main"
bosonic-qrc-dv-static-capacity = "bosonic_qrc_dv.static_capacity:main"
bosonic-qrc-dv-temporal-ipc = "bosonic_qrc_dv.temporal_qrc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
