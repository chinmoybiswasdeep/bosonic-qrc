[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cv-mb-qrc"
version = "0.1.0"
description = "Stateful measurement-based quantum reservoir computing"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "photographiq @ git+https://github.com/chinmoybiswasdeep/PhotoGraphiQ.git@36866f8eedd5c1a5b45239405e231bf80f2db061",
  "numpy>=1.26",
  "scipy>=1.12",
  "networkx>=3.2",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
]

[project.scripts]
bosonic-qrc-eoc-cvmb = "cv_mb_qrc.eoc.study:main"

[project.optional-dependencies]
graphix = ["graphix==0.4"]
validation = ["mentpy==0.1.0a15"]
experiments = ["matplotlib>=3.8", "scikit-learn>=1.3", "psutil>=5"]
docs = ["mkdocs>=1.6,<2", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/cv_mb_qrc"]

[tool.hatch.build.targets.sdist]
exclude = ["/.git", "/.venv", "/site", "/dist", "/experiments/measurement_based_reservoir/results/build", "/experiments/measurement_based_reservoir/results/site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/cv_mb_qrc"]
ignore_missing_imports = true
check_untyped_defs = true
